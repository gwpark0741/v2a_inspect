services:
  inference:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        APP_UID: ${V2A_DOCKER_UID:-1000}
        APP_GID: ${V2A_DOCKER_GID:-1000}
    image: ${V2A_INSPECT_SERVER_IMAGE:-v2a-inspect-server:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    gpus:
      - driver: nvidia
        device_ids: ["${V2A_GPU_DEVICE:-0}"]
    environment:
      V2A_SERVER_HOST: 0.0.0.0
      V2A_SERVER_PORT: 8080
      V2A_SERVER_UPLOAD_DIR: /data/uploads
      V2A_SERVER_HUNYUAN_MODEL_PATH: /data/model-cache/hunyuan
      V2A_SERVER_HUNYUAN_MODEL_SIZE: ${V2A_SERVER_HUNYUAN_MODEL_SIZE:-xl}
      V2A_SERVER_HUNYUAN_ENABLE_OFFLOAD: ${V2A_SERVER_HUNYUAN_ENABLE_OFFLOAD:-false}
      V2A_SERVER_KOKORO_MODEL_ID: ${V2A_SERVER_KOKORO_MODEL_ID:-hexgrad/Kokoro-82M}
      V2A_SERVER_KOKORO_LANGUAGE: ${V2A_SERVER_KOKORO_LANGUAGE:-a}
      V2A_SERVER_KOKORO_VOICE: ${V2A_SERVER_KOKORO_VOICE:-af_heart}
      V2A_SERVER_KOKORO_DEVICE: ${V2A_SERVER_KOKORO_DEVICE:-cpu}
      HF_HOME: /data/model-cache/huggingface
      TRANSFORMERS_CACHE: /data/model-cache/transformers
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    volumes:
      - v2a_server_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m

  v2a-inspect:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${V2A_INSPECT_IMAGE:-v2a-inspect:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      inference:
        condition: service_started
    ports:
      - "127.0.0.1:${V2A_INSPECT_UI_PORT:-8501}:8501"
    environment:
      V2A_INSPECT_UI_HOST: 0.0.0.0
      V2A_INSPECT_UI_PORT: 8501
      V2A_INSPECT_UI_WORK_DIR: /data/work
      V2A_INSPECT_UI_STATIC_DIR: /app/web/dist
      V2A_INSPECT_UI_SERVER_URL: http://inference:8080
      V2A_INSPECT_CLIENT_SERVER_HOST: inference
      V2A_INSPECT_CLIENT_SERVER_PORT: 8080
      V2A_INSPECT_CLIENT_TIMEOUT: ${V2A_INSPECT_CLIENT_TIMEOUT:-300}


      V2A_INSPECT_LLM_SMALL_MODEL: ${V2A_INSPECT_LLM_SMALL_MODEL:-gemini-3.1-flash-lite}
      V2A_INSPECT_LLM_MEDIUM_MODEL: ${V2A_INSPECT_LLM_MEDIUM_MODEL:-gemini-3.5-flash}
      V2A_INSPECT_LLM_LARGE_MODEL: ${V2A_INSPECT_LLM_LARGE_MODEL:-gemini-3.5-flash}
      V2A_INSPECT_LLM_THINKING_LEVEL: ${V2A_INSPECT_LLM_THINKING_LEVEL:-low}
      V2A_INSPECT_LLM_SMALL_THINKING_LEVEL: ${V2A_INSPECT_LLM_SMALL_THINKING_LEVEL:-medium}
      V2A_INSPECT_LLM_MEDIUM_THINKING_LEVEL: ${V2A_INSPECT_LLM_MEDIUM_THINKING_LEVEL:-low}
      V2A_INSPECT_LLM_LARGE_THINKING_LEVEL: ${V2A_INSPECT_LLM_LARGE_THINKING_LEVEL:-low}
      V2A_INSPECT_LLM_THINKING_BUDGET: ${V2A_INSPECT_LLM_THINKING_BUDGET:-}
      V2A_INSPECT_LLM_SMALL_THINKING_BUDGET: ${V2A_INSPECT_LLM_SMALL_THINKING_BUDGET:-}
      V2A_INSPECT_LLM_MEDIUM_THINKING_BUDGET: ${V2A_INSPECT_LLM_MEDIUM_THINKING_BUDGET:-}
      V2A_INSPECT_LLM_LARGE_THINKING_BUDGET: ${V2A_INSPECT_LLM_LARGE_THINKING_BUDGET:-}
      V2A_INSPECT_LLM_TEMPERATURE: ${V2A_INSPECT_LLM_TEMPERATURE:-1}
      V2A_INSPECT_LLM_TIMEOUT_SECONDS: ${V2A_INSPECT_LLM_TIMEOUT_SECONDS:-600}
      V2A_INSPECT_LLM_MAX_RETRIES: ${V2A_INSPECT_LLM_MAX_RETRIES:-5}
      V2A_INSPECT_LLM_INITIAL_SCENE_ANALYSIS_BATCH_SIZE: ${V2A_INSPECT_LLM_INITIAL_SCENE_ANALYSIS_BATCH_SIZE:-32}
      V2A_INSPECT_AGENT_SOUND_TIMELINE_RECURSION_LIMIT: ${V2A_INSPECT_AGENT_SOUND_TIMELINE_RECURSION_LIMIT:-500}
      V2A_INSPECT_AGENT_SOUND_TIMELINE_MAX_WORKERS: ${V2A_INSPECT_AGENT_SOUND_TIMELINE_MAX_WORKERS:-3}
      V2A_INSPECT_AGENT_SOUND_TIMELINE_SEGMENT_SECONDS: ${V2A_INSPECT_AGENT_SOUND_TIMELINE_SEGMENT_SECONDS:-30}

      V2A_INSPECT_LANGFUSE_BASE_URL: ${V2A_INSPECT_LANGFUSE_BASE_URL:-https://langfuse.riverfog7.com}
      V2A_INSPECT_LANGFUSE_ENVIRONMENT: ${V2A_INSPECT_LANGFUSE_ENVIRONMENT:-prod}
      V2A_INSPECT_LANGFUSE_RELEASE: ${V2A_INSPECT_LANGFUSE_RELEASE:-}

      V2A_INSPECT_AUTH_COOKIE: ${V2A_INSPECT_AUTH_COOKIE:-v2a_inspect_auth}
      V2A_INSPECT_AUTH_MAX_AGE_SECONDS: ${V2A_INSPECT_AUTH_MAX_AGE_SECONDS:-604800}
      V2A_INSPECT_VIDEO_ENCODE_USE_NVENC: ${V2A_INSPECT_VIDEO_ENCODE_USE_NVENC:-false}
    volumes:
      - v2a_inspect_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/healthz').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  v2a_inspect_data:
  v2a_server_data:
